name: Update Package Listing

on:
  release:
    types: [published]

jobs:
  update-listing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout listing repo
        uses: actions/checkout@v4
        with:
          repository: ElMoha943/valenvrc_package_listing
          token: ${{ secrets.LISTING_TOKEN }}
          path: listing

      - name: Update source.json
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          OWNER: ${{ github.repository_owner }}

        run: |
          cd listing

          python << EOF
          import json
          import os

          repo = os.environ["REPO_NAME"]
          tag = os.environ["RELEASE_TAG"]
          owner = os.environ["OWNER"]

          release_url = (
              f"https://github.com/{owner}/{repo}"
              f"/releases/download/{tag}/{repo}.zip"
          )

          with open("source.json", "r", encoding="utf8") as f:
              data = json.load(f)

          found = False

          for package in data["packages"]:
              if package["name"] == repo:
                  found = True

                  if release_url not in package["releases"]:
                      package["releases"].insert(0, release_url)

          if not found:
              raise Exception(f"Package '{repo}' not found in source.json")

          with open("source.json", "w", encoding="utf8") as f:
              json.dump(data, f, indent=4)

          print("source.json updated")
          EOF

      - name: Commit & Push
        run: |
          cd listing

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add source.json

          git commit -m "Add ${{ github.event.repository.name }} ${{ github.event.release.tag_name }}" || exit 0

          git push